# Search macros that make every panel resilient to the index layout.
#
# On a full deployment the agent writes to dedicated indexes
# (soc_copilot_findings / soc_copilot_feedback). On a self-service Splunk Cloud
# stack that only ships the `main` index, the HEC writer transparently re-routes
# events to `main` (tagged with a distinct sourcetype). These macros match either
# location so the dashboard works in both cases without edits.

[soc_findings]
definition = (index=soc_copilot_findings OR index=main) sourcetype="soc_copilot:finding"
iseval = 0

[soc_feedback]
definition = (index=soc_copilot_feedback OR index=main) sourcetype="soc_copilot:feedback"
iseval = 0
