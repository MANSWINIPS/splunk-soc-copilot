name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src
        continue-on-error: true  # advisory until type coverage is complete

      - name: Test
        run: pytest -v

  appinspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install splunk-appinspect
        run: pip install splunk-appinspect
      - name: Package app
        run: |
          cd splunk_app
          tar -czf soc_copilot.tar.gz soc_copilot/
      - name: Run App Inspect
        run: splunk-appinspect inspect splunk_app/soc_copilot.tar.gz --mode test --included-tags cloud --excluded-tags manual
        continue-on-error: true  # advisory — App Inspect is informational on this run
